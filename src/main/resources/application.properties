spring.application.name=qc-lims-backend

# Server
server.port=8080

# DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/qc_lims?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=qc_lims

# JWT
app.jwt.secret=qc-lims-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
app.jwt.expiration-ms=86400000
app.jwt.issuer=qc-lims

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
